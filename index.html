    <svg class="arbol arbol-c" viewBox="0 0 100 150"><rect x="44" y="124" width="12" height="22" fill="#6b4423"/><polygon points="50,6 82,58 18,58" fill="#1f7a45"/><polygon points="50,30 90,95 10,95" fill="#18693b"/><polygon points="50,60 96,128 4,128" fill="#115a31"/><circle cx="38" cy="82" r="4" fill="#f2c14e"/><circle cx="66" cy="104" r="4" fill="#d9363e"/><circle cx="36" cy="114" r="4" fill="#f2c14e"/><circle cx="58" cy="50" r="3.5" fill="#d9363e"/></svg>

  </div>

  <main class="contenedor">
    <header class="cabecera">
      <h1 id="titulo">Calendari d'Advent</h1>
      <p id="estado" class="estado"></p>
    </header>

    <section id="calendario" class="calendario" aria-label="Calendari d'Advent"></section>

    <p id="final" class="final" hidden></p>
  </main>

  <dialog id="modal" class="modal" aria-labelledby="modal-titulo">
    <article class="modal-caja">
      <button class="modal-cerrar" id="modal-cerrar" aria-label="Tanca">&times;</button>
      <p class="modal-dia" id="modal-dia"></p>
      <h2 id="modal-titulo"></h2>
      <p id="modal-texto" class="modal-texto"></p>
      <button id="modal-respuesta-btn" class="boton" hidden>Mostra la resposta</button>
      <p id="modal-respuesta" class="modal-respuesta" hidden></p>
    </article>
  </dialog>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="contenido.js"></script>
  <script src="script.js"></script>
</body>
</html>
